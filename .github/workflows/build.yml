name: Build PDF

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with pdfLaTeX (TeX Live, as on arXiv and Overleaf)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Bundle the Overleaf / arXiv source zip
        run: |
          mkdir -p dist
          cp main.pdf dist/main.pdf
          zip -j dist/thefinai-arxiv.zip thefinai.sty main.tex references.bib main.bbl README.md

      - uses: actions/upload-artifact@v4
        with:
          name: thefinai-arxiv
          path: dist/

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/main.pdf
            dist/thefinai-arxiv.zip
